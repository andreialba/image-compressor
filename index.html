    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Xoco Image Compressor",
        "url": "https://compress.xocoweb.com/",
        "description": "Free JPEG, PNG and WebP compression that runs entirely in your browser. Your images never leave your device.",

          "Compress JPEG, PNG and WebP",
          "Convert between JPEG, PNG and WebP",
          "Batch compression with ZIP download",
          "Resize to a maximum width or height",

    <script>
      try {
        var stored = localStorage.getItem('image-compressor-dark-mode');
        var dark = stored !== null ? stored === 'true' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-white dark:bg-black text-black dark:text-white antialiased transition-colors duration-300 selection:bg-gray-200 selection:text-black dark:selection:bg-gray-800 dark:selection:text-white">
    <noscript>Xoco Image Compressor needs JavaScript to compress images in your browser.</noscript>
    <div id="root"></div>
